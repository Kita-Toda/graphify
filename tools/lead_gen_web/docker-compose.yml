services:
  app:
    build:
      context: ../..          # repo root — so COPY tools/… and COPY graphify/… work
      dockerfile: tools/lead_gen_web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
